<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 白驹过隙</title>
  <link rel="stylesheet" href="/css/style.css?v=27">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(60,50,30,0.08);
      text-align: center;
    }
    .login-logo {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 28px;
    }
    .login-field {
      margin-bottom: 16px;
      text-align: left;
    }
    .login-field label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .login-field input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .login-field input:focus {
      border-color: var(--accent);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: var(--accent);
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="白驹过隙">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
</head>
<body>
  <div class="login-card">
    <div class="login-logo">⏳</div>
    <div class="login-title">白驹过隙</div>
    <div class="login-sub">日均成本追踪系统</div>

    <div id="loginTabs" style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border);">
      <div id="tabLogin" onclick="switchTab('login')" style="flex:1;text-align:center;padding:10px;cursor:pointer;font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);margin-bottom:-2px;">登录</div>
      <div id="tabRegister" onclick="switchTab('register')" style="flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--text2);">注册</div>
    </div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="login-field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="login-error" id="loginError"></div>
    </form>
    <form id="registerForm" onsubmit="doRegister(event)" style="display:none;">
      <div class="login-field">
        <label>用户名</label>
        <input type="text" id="regUsername" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label>密码</label>
        <input type="password" id="regPassword" autocomplete="new-password" required>
      </div>
      <div class="login-field">
        <label>确认密码</label>
        <input type="password" id="regConfirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="login-btn" id="regBtn">注 册</button>
      <div class="login-error" id="regError"></div>
    </form>
  </div>

  <script>


    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
      document.getElementById('tabLogin').style.color = isLogin ? '#9d2933' : '#8a8578';
      document.getElementById('tabLogin').style.fontWeight = isLogin ? '600' : '400';
      document.getElementById('tabLogin').style.borderBottom = isLogin ? '2px solid #9d2933' : '2px solid transparent';
      document.getElementById('tabRegister').style.color = isLogin ? '#8a8578' : '#9d2933';
      document.getElementById('tabRegister').style.fontWeight = isLogin ? '400' : '600';
      document.getElementById('tabRegister').style.borderBottom = isLogin ? '2px solid transparent' : '2px solid #9d2933';
      document.getElementById('loginError').textContent = '';
      document.getElementById('regError').textContent = '';
    }

    async function doRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const err = document.getElementById('regError');
      const pw = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (pw !== confirm) { err.textContent = '两次密码不一致'; return; }
      if (pw.length < 6) { err.textContent = '密码至少6位'; return; }
      btn.disabled = true;
      err.textContent = '';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            password: pw,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          err.textContent = data.detail || '注册失败';
        }
      } catch (e) { err.textContent = '网络错误'; }
      btn.disabled = false;
    }

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true;
      err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          err.textContent = data.detail || '登录失败';
        }
      } catch (e) {
        err.textContent = '网络错误';
      }
      btn.disabled = false;
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>

</body>
</html>
